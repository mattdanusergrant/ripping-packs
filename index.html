<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ripping Packs</title>
<style>
  :root {
    --bg: #0e0a1a;
    --panel: #1a1530;
    --panel-light: #251f44;
    --ink: #ebe6ff;
    --muted: #8a82b8;
    --gold: #f5c542;
    --common: #b8b8c8;
    --uncommon: #5ad06a;
    --rare: #5aa8ff;
    --mythic: #ff7a3d;
    --foil: linear-gradient(135deg, #ff7eb3, #65d6ff, #b8ff5a, #ffd84d, #ff7eb3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Roboto, system-ui, sans-serif; height: 100%; }
  body { display: grid; grid-template-columns: 1fr 1.3fr; grid-template-rows: auto 1fr auto; height: 100vh; gap: 12px; padding: 12px; }
  header { grid-column: 1 / 3; display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: var(--panel); border-radius: 10px; }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }
  header .stats { display: flex; gap: 24px; font-size: 0.95rem; align-items: center; }
  header .stats span b { color: var(--gold); }

  #shop, #vault { background: var(--panel); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #shop h2, #vault h2 { margin: 0; letter-spacing: 1px; font-size: 1rem; }

  .buy-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .buy-btn {
    background: var(--panel-light); border: 1px solid #3a3260; border-radius: 8px;
    padding: 10px 8px; color: var(--ink); cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; gap: 2px; transition: all 0.15s;
    text-align: center;
  }
  .buy-btn:hover:not(:disabled) { background: #2a2348; border-color: var(--gold); transform: translateY(-1px); }
  .buy-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .buy-btn .lbl { font-weight: bold; font-size: 0.95rem; letter-spacing: 1px; }
  .buy-btn .qty { color: var(--muted); font-size: 0.7rem; }
  .buy-btn .cost { color: var(--gold); font-size: 0.9rem; margin-top: 4px; font-weight: bold; }
  .buy-btn .save { color: var(--uncommon); font-size: 0.65rem; }

  #pack-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
  .pack {
    width: 200px; height: 290px; border-radius: 14px;
    background: linear-gradient(135deg, #3a2562, #5a2d8a 50%, #2d4a8a);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    user-select: none; position: relative; overflow: hidden;
  }
  .pack::after { content: ""; position: absolute; inset: 8px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 10px; pointer-events: none; }
  .pack:hover:not(.disabled) { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
  .pack.disabled { opacity: 0.45; cursor: not-allowed; }
  .pack .label { text-align: center; font-weight: 600; letter-spacing: 1px; }
  .pack .label small { display: block; color: var(--muted); font-weight: normal; margin-top: 6px; }

  #hint { text-align: center; font-size: 0.9rem; color: var(--gold); min-height: 1.2em; }

  .particle {
    position: fixed; pointer-events: none; z-index: 999;
    font-size: 1.3rem; line-height: 1;
    transform: translate(-50%, -50%);
    animation: particle-burst 0.75s ease-out forwards;
  }
  .particle.foil {
    text-shadow: 0 0 6px #fff, 0 0 14px #ffd84d;
    animation-duration: 1s;
  }
  @keyframes particle-burst {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
    50%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); }
  }

  .hit-popup {
    position: fixed; pointer-events: none; z-index: 1000;
    font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    transform: translate(-50%, -50%);
    animation: hit-float 1.5s ease-out forwards;
    white-space: nowrap;
  }
  .hit-popup.foil-hit {
    background: linear-gradient(90deg, #ff7eb3, #65d6ff, #b8ff5a, #ffd84d, #ff7eb3);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: hit-float 1.5s ease-out forwards, foil-text-scroll 1s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
  }
  @keyframes hit-float {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    40%  { opacity: 1; transform: translate(-50%, calc(-50% - 30px)) scale(1); }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - 90px)) scale(0.85); }
  }
  @keyframes foil-text-scroll {
    to { background-position: 200% center; }
  }

  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 250% 50%; } }

  /* ---- Vault collection grid -------------------------------------------- */
  #vault-grid {
    margin-top: 14px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .vault-grid-title {
    font-size: 0.7rem; letter-spacing: 3px; color: var(--muted);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 4px; margin-bottom: 2px;
  }
  .collection-row { display: flex; flex-direction: column; gap: 4px; }
  .collection-row-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.7rem; font-weight: bold; letter-spacing: 1.5px;
  }
  .collection-row-label .row-count {
    color: var(--muted); font-weight: normal; font-size: 0.65rem;
  }
  .collection-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(34px, 1fr));
    gap: 4px;
    background: rgba(0,0,0,0.22); border-radius: 6px; padding: 6px;
  }
  .collection-cell {
    position: relative;
    aspect-ratio: 5 / 7;
    border-radius: 3px;
    border: 1.5px solid rgba(255,255,255,0.10);
    background: rgba(255,255,255,0.02);
    color: rgba(255,255,255,0.18);
    font-size: 9px; font-weight: bold;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
  }
  .collection-cell.owned {
    background: color-mix(in srgb, var(--cell-color, #fff) 24%, var(--panel-light));
    border-color: var(--cell-color, #fff);
    color: #fff;
    box-shadow: 0 0 4px color-mix(in srgb, var(--cell-color, #fff) 50%, transparent);
  }
  .collection-cell.priced.owned { cursor: pointer; }
  .collection-cell.priced.owned:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.55),
                0 0 10px color-mix(in srgb, var(--cell-color, #fff) 70%, transparent);
    z-index: 4;
  }
  .collection-cell.foil.owned {
    background: linear-gradient(135deg, #ff7eb3, #65d6ff, #b8ff5a, #ffd84d, #ff7eb3);
    background-size: 250% 250%;
    animation: shimmer 2.5s linear infinite;
    color: #111;
    text-shadow: 0 0 2px rgba(255,255,255,0.7);
  }
  .collection-cell .cell-count {
    position: absolute; top: -3px; right: -3px;
    background: #111; color: #fff;
    border: 1px solid rgba(255,255,255,0.35);
    border-radius: 8px;
    font-size: 8px; font-weight: bold;
    padding: 0 3px; line-height: 1.2;
    min-width: 12px; text-align: center;
  }
  .collection-cell .cell-price {
    position: absolute; left: 1px; right: 1px; bottom: 1px;
    background: rgba(0,0,0,0.75); color: #fff;
    font-size: 7px; font-weight: bold;
    padding: 0 1px; border-radius: 2px; line-height: 1.25;
    text-align: center; pointer-events: none;
  }
  .collection-cell.flash {
    animation: card-pop 0.7s ease-out;
  }
  .collection-cell.flash-fresh {
    animation: card-pop-fresh 1.2s ease-out;
  }
  @keyframes card-pop {
    0%   { transform: scale(1);   box-shadow: 0 0 0 rgba(255,255,255,0); }
    25%  { transform: scale(1.5); box-shadow: 0 0 16px 6px rgba(255,255,255,0.75); filter: brightness(1.6); }
    100% { transform: scale(1);   box-shadow: 0 0 0 rgba(255,255,255,0); filter: brightness(1); }
  }
  @keyframes card-pop-fresh {
    0%   { transform: scale(1) rotate(0);     box-shadow: 0 0 0 rgba(255,255,255,0); }
    20%  { transform: scale(1.9) rotate(-4deg); box-shadow: 0 0 22px 9px rgba(255,255,255,0.95); filter: brightness(1.9) saturate(1.4); }
    60%  { transform: scale(1.2) rotate(2deg); box-shadow: 0 0 14px 4px rgba(255,255,255,0.5); }
    100% { transform: scale(1)   rotate(0);     box-shadow: 0 0 0 rgba(255,255,255,0); filter: brightness(1); }
  }

  #set-progress {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.18);
    border-radius: 6px;
  }
  .set-col-label {
    font-size: 0.6rem; letter-spacing: 2px; color: var(--muted);
    text-align: center; margin-bottom: 2px;
  }
  .set-bar { display: flex; flex-direction: column; gap: 2px; }
  .set-bar-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.65rem; font-weight: bold; letter-spacing: 1px;
  }
  .set-bar-count { color: var(--muted); font-weight: normal; }
  .set-bar-track {
    height: 5px; background: rgba(255,255,255,0.06);
    border-radius: 3px; overflow: hidden;
  }
  .set-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.35s ease;
  }
  .set-bar.foil .set-bar-fill {
    background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%);
    background-repeat: no-repeat;
    background-size: 60% 100%;
    background-position: -60% 0;
    animation: bar-foil-sweep 2.4s linear infinite;
  }
  .set-bar.complete .set-bar-fill {
    background: linear-gradient(90deg, #ff7eb3, #65d6ff, #b8ff5a, #ffd84d, #ff7eb3) !important;
    background-size: 200% auto;
    animation: shimmer-bar 2s linear infinite;
  }
  .set-bar.complete .set-bar-count { color: var(--gold); }
  @keyframes shimmer-bar { to { background-position: 200% center; } }
  @keyframes bar-foil-sweep { to { background-position: 160% 0; } }
  #sand-canvas {
    display: block; width: 100%; height: 320px;
    background: rgba(0,0,0,0.18); border-radius: 6px;
    cursor: pointer;
  }
  #sort-pile-header {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.72rem; color: var(--muted); letter-spacing: 1px;
    margin-bottom: 4px;
  }
  #sort-pile-header .sort-hint { color: var(--gold); font-size: 0.68rem; }

  #stock-rows { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 4px; }
  .stock-row {
    background: var(--panel-light); border-radius: 8px; padding: 12px 14px;
    display: grid; grid-template-columns: 0.9fr 1.3fr auto; align-items: center; gap: 12px;
    border-left: 4px solid #444;
  }
  .stock-row.common    { border-left-color: var(--common); }
  .stock-row.uncommon  { border-left-color: var(--uncommon); }
  .stock-row.rare      { border-left-color: var(--rare); }
  .stock-row.mythic    { border-left-color: var(--mythic); box-shadow: 0 0 12px rgba(255,122,61,0.2); }
  .rarity-name { font-weight: bold; letter-spacing: 1px; font-size: 0.95rem; }
  .counts { display: flex; flex-direction: column; gap: 3px; font-size: 0.78rem; color: var(--muted); }
  .counts b { color: var(--ink); font-size: 0.9rem; }
  .counts .foil-line b { color: #fff; }
  .counts .foil-line { background: rgba(255,255,255,0.04); padding: 2px 6px; border-radius: 4px; }
  .counts .sell-price { font-size: 0.65rem; color: var(--gold); }
  .sell-stack { display: flex; flex-direction: column; gap: 6px; }
  .sell-stack-note { color: var(--muted); font-size: 0.7rem; font-style: italic; text-align: right; }
  .sell-btn {
    background: transparent; color: var(--gold); border: 1px solid var(--gold);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; font-family: inherit;
    font-weight: bold; font-size: 0.75rem; min-width: 160px; letter-spacing: 1px;
    transition: all 0.15s; white-space: nowrap;
  }
  .sell-btn:hover:not(:disabled) { background: var(--gold); color: #111; }
  .sell-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .sell-btn.foil {
    background: var(--foil); background-size: 250% 250%;
    animation: shimmer 3s linear infinite;
    color: #111; border-color: #fff;
  }
  .sell-btn.foil:hover:not(:disabled) { filter: brightness(1.1); }

  footer { grid-column: 1 / 3; text-align: center; color: var(--muted); font-size: 0.75rem; padding: 4px; }
  button.reset { background: transparent; color: var(--muted); border: 1px solid var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.75rem; }
  button.reset:hover { color: var(--ink); border-color: var(--ink); }

  @media (max-width: 900px) {
    body {
      grid-template-columns: 1fr; grid-template-rows: auto auto auto auto;
      height: auto; padding: 6px; gap: 6px;
    }
    header { grid-column: 1; padding: 6px 10px; }
    header h1 { font-size: 1rem; }
    header .stats { gap: 10px; font-size: 0.75rem; }
    footer { grid-column: 1; padding: 0; font-size: 0.65rem; }
    #shop, #vault { padding: 10px; gap: 8px; }
    #pack-area { gap: 8px; flex: 0 0 auto; }
    .pack { width: 150px; height: 215px; }
    .pack .label { font-size: 0.9rem; }
    .pack .label small { margin-top: 4px; }
    #sand-canvas { height: 220px; }
    .buy-btn { padding: 6px 4px; }
    .buy-btn .lbl { font-size: 0.85rem; }
    .buy-btn .qty { font-size: 0.6rem; }
    .buy-btn .cost { font-size: 0.8rem; margin-top: 2px; }
    .buy-btn .save { font-size: 0.55rem; }
    .collection-grid { grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 3px; padding: 4px; }
    .collection-cell { font-size: 8px; }
    .stock-row { padding: 8px 10px; gap: 8px; }
    #hint { font-size: 0.8rem; }
  }
</style>
</head>
<body>

<header>
  <h1>RIPPING PACKS</h1>
  <div class="stats">
    <span>Cash: <b id="coins">$0</b></span>
    <span>Packs opened: <b id="packs-opened">0</b></span>
    <span>Foils pulled: <b id="foils-pulled">0</b></span>
    <button class="reset" id="reset-btn">Reset</button>
  </div>
</header>

<section id="shop">
  <h2>SHOP</h2>
  <div class="buy-buttons">
    <button class="buy-btn" id="buy-pack">
      <div class="lbl">PACK</div>
      <div class="qty">1 pack</div>
      <div class="cost" id="cost-pack">$4</div>
    </button>
    <button class="buy-btn" id="buy-box">
      <div class="lbl">BOX</div>
      <div class="qty">36 packs</div>
      <div class="cost" id="cost-box">$125</div>
      <div class="save">save 11%</div>
    </button>
    <button class="buy-btn" id="buy-case">
      <div class="lbl">CASE</div>
      <div class="qty">6 boxes · 216 packs</div>
      <div class="cost" id="cost-case">$700</div>
      <div class="save">save 17%</div>
    </button>
  </div>
  <div id="set-progress"></div>
  <div id="pack-area">
    <div class="pack" id="pack">
      <div class="label">SERIES I<br>BOOSTER<small id="supply-label">Supply: 0</small></div>
    </div>
<div id="hint">A box on the house — start ripping!</div>
  </div>
  <div>
    <div id="sort-pile-header">
      <span>UNSORTED PILE · <span id="unsorted-total">0</span></span>
      <span class="sort-hint" id="sort-hint">click to sort <span id="sort-range-label"></span></span>
    </div>
    <canvas id="sand-canvas"></canvas>
  </div>
</section>

<section id="vault">
  <h2>VAULT</h2>
  <div id="stock-rows"></div>
  <div id="vault-grid"></div>
</section>

<footer>10 cards/pack — 5C · 3U · 1R/M · 1 special (85% common, 15% foil). Foil 10× sell value.</footer>

<script>
// ---- Config --------------------------------------------------------------
const RARITIES = ["common", "uncommon", "rare", "mythic"];
const RARITY_LABELS  = { common: "COMMON",   uncommon: "UNCOMMON", rare: "RARE",  mythic: "MYTHIC" };
const RARITY_COLOURS = { common: "#b8b8c8",  uncommon: "#5ad06a",  rare: "#5aa8ff", mythic: "#ff7a3d" };
const RARITY_GLYPHS  = { common: "●",        uncommon: "◆",        rare: "★",      mythic: "✦" };
const SELL_PRICE     = { common: 0.10,       uncommon: 0.30,       rare: 1,        mythic: 10      };

// ---- Sorting -------------------------------------------------------------
// Tweak these to tune the sorting loop.
const SORT_MIN            = 1;    // min cards per click
const SORT_MAX            = 3;    // max cards per click (inclusive)
const SORT_CRIT_CHANCE    = 0.10; // 10% chance to crit
const SORT_CRIT_MULTIPLIER = 3;   // crit multiplies sorted count by this
const UNSORTED_CAPACITY    = 500; // hard cap on unsorted bulk cards

const FOIL_MULTIPLIER = 10;
// Special slot: 15% chance the slot becomes a foil; foil rarity weighted toward common
const FOIL_SLOT_CHANCE = 0.15;
const FOIL_RARITY_WEIGHTS = { common: 0.60, uncommon: 0.25, rare: 0.12, mythic: 0.03 };

// ---- Set / identity -----------------------------------------------------
// Composite card IDs bake in GAME, SET, and CARD numbers so additional games
// and sets can be added without colliding with existing data.
const GAME_ID = 1;
const SET_ID  = 1;
const SET_SIZES = { common: 100, uncommon: 80, rare: 50, mythic: 20 };
// Card numbers are globally unique within a set, across rarities.
const CARD_NUMBER_OFFSETS = { common: 0, uncommon: 100, rare: 180, mythic: 230 };
const TOTAL_SET_CARDS = 250;
const SET_VERSION = 2; // bump when SET_SIZES change so old saves get migrated

function cardFullId(rarity, idx, game, set) {
  const g = game ?? GAME_ID;
  const s = set  ?? SET_ID;
  const n = CARD_NUMBER_OFFSETS[rarity] + idx;
  return `G${g}-S${s}-C${String(n).padStart(3, "0")}`;
}

// ---- Market -------------------------------------------------------------
// Mythics and all foils have per-ID live prices that drift over time.
// Commons, uncommons, and non-foil rares stay bulk-priced (SELL_PRICE).
const MARKET_KEYS = ["mythic", "foilCommon", "foilUncommon", "foilRare", "foilMythic"];
const MARKET_VERSION = 5; // bump to force regeneration when baselines change
const BASELINE = {
  mythic:       10,
  foilCommon:   1,
  foilUncommon: 3,
  foilRare:     10,
  foilMythic:   100,
};
const FUND_MIN_MULT = 0.4;       // per-card fundamental: 0.4× to 2.6× baseline
const FUND_RANGE    = 2.2;
const TICK_VOLATILITY = 0.05;    // ± 5% per tick noise
const TICK_REVERT     = 0.07;    // pull 7% toward fundamental per tick
const TICK_FUND_DRIFT = 0.005;   // fundamental itself wanders ± 0.5% per tick
const PRICE_FLOOR_RATIO = 0.12;  // never below 12% of fundamental
const PRICE_CEIL_RATIO  = 7;     // cap at 7× fundamental
const MARKET_TICK_MS = 7000;

function marketKey(rarity, foil) {
  if (!foil && rarity === "mythic") return "mythic";
  if (foil) {
    if (rarity === "common")   return "foilCommon";
    if (rarity === "uncommon") return "foilUncommon";
    if (rarity === "rare")     return "foilRare";
    if (rarity === "mythic")   return "foilMythic";
  }
  return null;
}

const PACK_COST = 4;
const BOX_COST  = 125;
const CASE_COST = 700;
const BOX_SIZE  = 36;
const CASE_SIZE = 216;

function foilPrice(rarity) { return SELL_PRICE[rarity] * FOIL_MULTIPLIER; }

// ---- State ---------------------------------------------------------------
const SAVE_KEY = "cryptid_almanac_save_v4"; // bumped: starter box
const defaultState = () => ({
  coins: 0,
  packsOpened: 0,
  packSupply: BOX_SIZE, // start with a box on the house
  unsorted:   { common: 0, uncommon: 0, rare: 0 },
  stock:      { common: 0, uncommon: 0, rare: 0, mythic: 0 },
  stockFoil:  { common: 0, uncommon: 0, rare: 0, mythic: 0 },
  opened:     { common: 0, uncommon: 0, rare: 0, mythic: 0 },
  openedFoil: { common: 0, uncommon: 0, rare: 0, mythic: 0 },
  pile: [], // [colIndex] = array of rarity strings, bottom-up
  owned:     { common: [], uncommon: [], rare: [], mythic: [] },
  ownedFoil: { common: [], uncommon: [], rare: [], mythic: [] },
  setsCelebrated:     { common: false, uncommon: false, rare: false, mythic: false },
  setsCelebratedFoil: { common: false, uncommon: false, rare: false, mythic: false },
  invById:     emptyInvById(),
  market:      null, // {key: per-card live prices}, populated by initMarket
  marketFund:  null, // same shape, fundamental values
  marketVersion: MARKET_VERSION,
  setVersion: SET_VERSION,
});

function emptyInvById() {
  const o = {};
  MARKET_KEYS.forEach(k => { o[k] = {}; });
  return o;
}

function marketKeySize(k) {
  const meta = rarityFromMarketKey(k);
  return meta ? SET_SIZES[meta.rarity] : 0;
}

function initMarket() {
  state.market     = {};
  state.marketFund = {};
  MARKET_KEYS.forEach(k => {
    const baseline = BASELINE[k];
    const size = marketKeySize(k);
    const fund = [0]; // index 0 unused
    const live = [0];
    for (let i = 1; i <= size; i++) {
      const f = baseline * (FUND_MIN_MULT + Math.random() * FUND_RANGE);
      fund.push(f);
      live.push(f);
    }
    state.marketFund[k] = fund;
    state.market[k]     = live;
  });
}

function tickMarket() {
  if (!state.market) return;
  MARKET_KEYS.forEach(k => {
    const live = state.market[k];
    const fund = state.marketFund[k];
    const size = marketKeySize(k);
    for (let i = 1; i <= size; i++) {
      // Slowly drift the fundamental too
      fund[i] *= 1 + (Math.random() - 0.5) * 2 * TICK_FUND_DRIFT;
      const f = fund[i];
      const noise = (Math.random() - 0.5) * 2 * TICK_VOLATILITY;
      const revert = ((f - live[i]) / f) * TICK_REVERT;
      let p = live[i] * (1 + noise + revert);
      p = Math.max(p, f * PRICE_FLOOR_RATIO);
      p = Math.min(p, f * PRICE_CEIL_RATIO);
      live[i] = p;
    }
  });
  renderVault();
  renderVaultGrid();
}

function inventoryValue(rarity, foil) {
  const mk = marketKey(rarity, foil);
  if (!mk) {
    const bucket = foil ? state.stockFoil : state.stock;
    const price = foil ? foilPrice(rarity) : SELL_PRICE[rarity];
    return bucket[rarity] * price;
  }
  const inv = state.invById[mk];
  const prices = state.market[mk];
  let total = 0;
  for (const id in inv) {
    total += inv[id] * prices[id];
  }
  return total;
}

function inventoryAvgPrice(rarity, foil) {
  const mk = marketKey(rarity, foil);
  if (!mk) return foil ? foilPrice(rarity) : SELL_PRICE[rarity];
  const inv = state.invById[mk];
  const prices = state.market[mk];
  let total = 0, count = 0;
  for (const id in inv) {
    total += inv[id] * prices[id];
    count += inv[id];
  }
  return count === 0 ? 0 : total / count;
}

function pickRandomIds(rarity, n) {
  const size = SET_SIZES[rarity];
  const all = [];
  for (let i = 1; i <= size; i++) all.push(i);
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all.slice(0, Math.min(n, size)).sort((a, b) => a - b);
}
let state = load() || defaultState();
if (!state.market) initMarket();

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (typeof parsed.coins !== "number" || !parsed.stock || !parsed.stockFoil) return null;
    if (!Array.isArray(parsed.pile)) parsed.pile = [];
    if (!parsed.owned) {
      // Backfill set ownership for legacy saves: grant random IDs based on lifetime opened.
      parsed.owned     = { common: [], uncommon: [], rare: [], mythic: [] };
      parsed.ownedFoil = { common: [], uncommon: [], rare: [], mythic: [] };
      RARITIES.forEach(r => {
        parsed.owned[r]     = pickRandomIds(r, parsed.opened[r]     || 0);
        parsed.ownedFoil[r] = pickRandomIds(r, parsed.openedFoil[r] || 0);
      });
    }
    if (!parsed.setsCelebrated) {
      parsed.setsCelebrated     = { common: false, uncommon: false, rare: false, mythic: false };
      parsed.setsCelebratedFoil = { common: false, uncommon: false, rare: false, mythic: false };
      RARITIES.forEach(r => {
        if (parsed.owned[r].length     >= SET_SIZES[r]) parsed.setsCelebrated[r]     = true;
        if (parsed.ownedFoil[r].length >= SET_SIZES[r]) parsed.setsCelebratedFoil[r] = true;
      });
    }
    if (!parsed.invById) {
      // Legacy: distribute existing stock counts randomly across IDs.
      const inv = {};
      MARKET_KEYS.forEach(k => { inv[k] = {}; });
      const mythicSize = SET_SIZES.mythic;
      for (let i = 0; i < (parsed.stock.mythic || 0); i++) {
        const id = Math.floor(Math.random() * mythicSize) + 1;
        inv.mythic[id] = (inv.mythic[id] || 0) + 1;
      }
      ["common", "uncommon", "rare", "mythic"].forEach(r => {
        const mk = marketKey(r, true);
        if (!mk) return;
        const size = SET_SIZES[r];
        for (let i = 0; i < (parsed.stockFoil[r] || 0); i++) {
          const id = Math.floor(Math.random() * size) + 1;
          inv[mk][id] = (inv[mk][id] || 0) + 1;
        }
      });
      parsed.invById = inv;
    }
    if (parsed.setVersion !== SET_VERSION) {
      // Migrate: IDs that exceeded the new per-rarity cap get remapped.
      RARITIES.forEach(r => {
        const max = SET_SIZES[r];
        if (Array.isArray(parsed.owned[r]))     parsed.owned[r]     = parsed.owned[r].filter(id => id >= 1 && id <= max);
        if (Array.isArray(parsed.ownedFoil[r])) parsed.ownedFoil[r] = parsed.ownedFoil[r].filter(id => id >= 1 && id <= max);
      });
      if (parsed.invById) {
        MARKET_KEYS.forEach(mk => {
          const meta = rarityFromMarketKey(mk);
          if (!meta) return;
          const max = SET_SIZES[meta.rarity];
          const oldBucket = parsed.invById[mk] || {};
          const newBucket = {};
          Object.entries(oldBucket).forEach(([id, count]) => {
            const i = parseInt(id, 10);
            const target = (i >= 1 && i <= max) ? i : (Math.floor(Math.random() * max) + 1);
            newBucket[target] = (newBucket[target] || 0) + count;
          });
          parsed.invById[mk] = newBucket;
        });
      }
      if (parsed.setsCelebrated) {
        RARITIES.forEach(r => {
          parsed.setsCelebrated[r]     = (parsed.owned[r]     || []).length >= SET_SIZES[r];
          parsed.setsCelebratedFoil[r] = (parsed.ownedFoil[r] || []).length >= SET_SIZES[r];
        });
      }
      parsed.setVersion = SET_VERSION;
    }
    if (parsed.marketVersion !== MARKET_VERSION) {
      parsed.market = null;
      parsed.marketFund = null;
      parsed.marketVersion = MARKET_VERSION;
    }
    if (!parsed.unsorted) {
      // Treat existing bulk stock as unsorted so the pile stays intact
      parsed.unsorted = {
        common:   parsed.stock.common   || 0,
        uncommon: parsed.stock.uncommon || 0,
        rare:     parsed.stock.rare     || 0,
      };
      parsed.stock.common   = 0;
      parsed.stock.uncommon = 0;
      parsed.stock.rare     = 0;
    }
    return parsed;
  } catch { return null; }
}
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function fmt(n) {
  if (n < 1) return n.toFixed(2);
  return Math.floor(n).toLocaleString();
}
function usd(n) { return "$" + fmt(n); }
function compactUsd(n) {
  if (n < 1) return "$" + n.toFixed(2);
  n = Math.floor(n);
  if (n >= 10000) return "$" + Math.round(n / 1000) + "k";
  if (n >= 1000)  return "$" + (n / 1000).toFixed(1).replace(/\.0$/, "") + "k";
  return "$" + n;
}
function rarityFromMarketKey(k) {
  if (k === "mythic")       return { rarity: "mythic",   foil: false };
  if (k === "foilCommon")   return { rarity: "common",   foil: true  };
  if (k === "foilUncommon") return { rarity: "uncommon", foil: true  };
  if (k === "foilRare")     return { rarity: "rare",     foil: true  };
  if (k === "foilMythic")   return { rarity: "mythic",   foil: true  };
  return null;
}

// ---- Pulls ---------------------------------------------------------------
function rollRareMythicSlot() {
  return Math.random() < 0.10 ? "mythic" : "rare";
}
function rollFoilRarity() {
  const r = Math.random();
  if (r < FOIL_RARITY_WEIGHTS.mythic)   return "mythic";
  if (r < FOIL_RARITY_WEIGHTS.mythic + FOIL_RARITY_WEIGHTS.rare)   return "rare";
  if (r < FOIL_RARITY_WEIGHTS.mythic + FOIL_RARITY_WEIGHTS.rare + FOIL_RARITY_WEIGHTS.uncommon) return "uncommon";
  return "common";
}
function rollSpecialSlot() {
  // Only source of foils: 15% foil (rarity-weighted), otherwise a common
  if (Math.random() < FOIL_SLOT_CHANCE) return { rarity: rollFoilRarity(), foil: true };
  return { rarity: "common", foil: false };
}
function randomCardId(rarity) { return Math.floor(Math.random() * SET_SIZES[rarity]) + 1; }
function rollPack() {
  // 5 commons, 3 uncommons, 1 rare/mythic, 1 special (common or foil)
  const cards = [];
  for (let i = 0; i < 5; i++) cards.push({ rarity: "common",   foil: false });
  for (let i = 0; i <  3; i++) cards.push({ rarity: "uncommon", foil: false });
  cards.push({ rarity: rollRareMythicSlot(), foil: false });
  cards.push(rollSpecialSlot());
  return cards.map(c => ({ ...c, id: randomCardId(c.rarity) }));
}
function addPull(card) {
  if (card.foil) {
    state.stockFoil[card.rarity]  += 1;
    state.openedFoil[card.rarity] += 1;
  } else {
    if (SAND_BULK_RARITIES.includes(card.rarity)) {
      state.unsorted[card.rarity] += 1;
    } else {
      state.stock[card.rarity] += 1;
    }
    state.opened[card.rarity] += 1;
  }
  const mk = marketKey(card.rarity, card.foil);
  if (mk) {
    state.invById[mk][card.id] = (state.invById[mk][card.id] || 0) + 1;
  }
  const ownedList = card.foil ? state.ownedFoil[card.rarity] : state.owned[card.rarity];
  const wasNew = !ownedList.includes(card.id);
  flashQueue.push({ rarity: card.rarity, id: card.id, foil: card.foil, fresh: wasNew });
  if (wasNew) {
    ownedList.push(card.id);
    const completed = ownedList.length >= SET_SIZES[card.rarity];
    const celebratedFlag = card.foil ? state.setsCelebratedFoil : state.setsCelebrated;
    const firstCompletion = completed && !celebratedFlag[card.rarity];
    if (firstCompletion) celebratedFlag[card.rarity] = true;
    return { isNew: true, completed: firstCompletion };
  }
  return { isNew: false, completed: false };
}
function totalFoilsOpened() {
  return RARITIES.reduce((s, r) => s + state.openedFoil[r], 0);
}

function sellCard(rarity, id, foil) {
  const mk = marketKey(rarity, foil);
  if (!mk) return;
  const inv = state.invById[mk];
  if (!inv || !inv[id]) return;
  const price = Math.max(0.01, Math.round(state.market[mk][id] * 100) / 100);
  state.coins += price;
  inv[id] -= 1;
  if (inv[id] <= 0) delete inv[id];
  if (foil) state.stockFoil[rarity] -= 1;
  else      state.stock[rarity]     -= 1;
  renderAll(); save();
  $("hint").textContent = `Sold ${foil ? "foil " : ""}${RARITY_LABELS[rarity].toLowerCase()} ${cardFullId(rarity, id)} for ${usd(price)}.`;
}

// ---- Sand simulation -----------------------------------------------------
const SAND_GRAIN = 5;
const SAND_CELL  = 7;
const SAND_COLOR = { common: "#b8b8c8", uncommon: "#5ad06a", rare: "#5aa8ff" };
const SAND_BULK_RARITIES = ["common", "uncommon", "rare"];
let fallingGrains = []; // {col, y, vy, rarity}
let sandAnimRunning = false;

function sandColCount() {
  const c = $("sand-canvas");
  return Math.max(1, Math.floor((c.clientWidth || 300) / SAND_CELL));
}

function ensurePileBuckets() {
  const cols = sandColCount();
  while (state.pile.length < cols) state.pile.push([]);
}

function totalPileGrains() {
  return state.pile.reduce((s, col) => s + col.length, 0);
}

function rebuildPileFromStock() {
  state.pile = [];
  ensurePileBuckets();
  const cols = sandColCount();
  SAND_BULK_RARITIES.forEach(r => {
    for (let i = 0; i < state.unsorted[r]; i++) {
      const c = Math.floor(Math.random() * cols);
      state.pile[c].push(r);
    }
  });
}

function syncPileWithStock() {
  // If the pile and unsorted have drifted (eg. migration), rebuild.
  const unsortedBulk = SAND_BULK_RARITIES.reduce((s, r) => s + state.unsorted[r], 0);
  if (totalPileGrains() + fallingGrains.length !== unsortedBulk) {
    rebuildPileFromStock();
  }
}

function removeOneGrainByRarity(rarity) {
  // Prefer removing a still-falling grain so settled pile stays intact longer
  const fi = fallingGrains.findIndex(g => g.rarity === rarity);
  if (fi !== -1) { fallingGrains.splice(fi, 1); return; }
  // Walk columns tallest-first; pluck from the top of the first column
  // whose top grain matches. Falls back to digging the tallest column.
  const ordered = state.pile
    .map((col, c) => ({ c, h: col.length }))
    .sort((a, b) => b.h - a.h);
  for (const { c } of ordered) {
    const col = state.pile[c];
    if (col.length > 0 && col[col.length - 1] === rarity) {
      col.pop();
      return;
    }
  }
  for (const { c } of ordered) {
    const col = state.pile[c];
    for (let r = col.length - 1; r >= 0; r--) {
      if (col[r] === rarity) { col.splice(r, 1); return; }
    }
  }
}

function rollSortAmount() {
  const base = SORT_MIN + Math.floor(Math.random() * (SORT_MAX - SORT_MIN + 1));
  const crit = Math.random() < SORT_CRIT_CHANCE;
  return { amount: crit ? Math.floor(base * SORT_CRIT_MULTIPLIER) : base, crit };
}

function sortCards() {
  const total = SAND_BULK_RARITIES.reduce((s, r) => s + state.unsorted[r], 0);
  if (total === 0) return;
  const { amount, crit } = rollSortAmount();
  const actual = Math.min(amount, total);
  for (let i = 0; i < actual; i++) {
    const roll = Math.floor(Math.random() * (state.unsorted.common + state.unsorted.uncommon + state.unsorted.rare));
    const rarity = roll < state.unsorted.common ? "common"
                 : roll < state.unsorted.common + state.unsorted.uncommon ? "uncommon"
                 : "rare";
    state.unsorted[rarity] -= 1;
    state.stock[rarity]    += 1;
    removeOneGrainByRarity(rarity);
  }
  renderAll(); save();
  const tag = crit ? " ✨ CRIT!" : "";
  $("hint").textContent = `Sorted ${actual} card${actual > 1 ? "s" : ""}.${tag}`;
}

function removeGrainsByRarity(rarity) {
  if (!SAND_BULK_RARITIES.includes(rarity)) return;
  state.pile = state.pile.map(col => col.filter(r => r !== rarity));
}

function removeAllBulkGrains() {
  state.pile = state.pile.map(() => []);
}

function spawnSandFromPulls(pulls) {
  const bulk = pulls.filter(c => !c.foil && SAND_BULK_RARITIES.includes(c.rarity));
  ensurePileBuckets();
  const cols = sandColCount();
  // Spawn all grains synchronously into fallingGrains, but stagger their
  // starting Y so they enter the canvas one-by-one — creates a sandfall stream.
  bulk.forEach((card, i) => {
    fallingGrains.push({
      col: Math.floor(Math.random() * cols),
      y: -SAND_CELL - i * (SAND_CELL * 1.6) - Math.random() * 5,
      vy: 0,
      rarity: card.rarity,
    });
  });
  startSandAnim();
}

function drawSand() {
  const canvas = $("sand-canvas");
  const w = canvas.clientWidth  || 300;
  const h = canvas.clientHeight || 90;
  if (canvas.width  !== w) canvas.width  = w;
  if (canvas.height !== h) canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  const cols = sandColCount();
  for (let c = 0; c < state.pile.length && c < cols; c++) {
    const stack = state.pile[c];
    for (let r = 0; r < stack.length; r++) {
      const x = c * SAND_CELL + 1;
      const y = h - (r + 1) * SAND_CELL + 1;
      ctx.fillStyle = SAND_COLOR[stack[r]] || "#b8b8c8";
      ctx.beginPath();
      ctx.arc(x + SAND_GRAIN / 2, y + SAND_GRAIN / 2, SAND_GRAIN / 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  fallingGrains.forEach(g => {
    const x = g.col * SAND_CELL + 1;
    ctx.fillStyle = SAND_COLOR[g.rarity] || "#b8b8c8";
    ctx.beginPath();
    ctx.arc(x + SAND_GRAIN / 2, g.y + SAND_GRAIN / 2, SAND_GRAIN / 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function stepSandAnim() {
  const canvas = $("sand-canvas");
  const h = canvas.clientHeight || 90;
  ensurePileBuckets();
  fallingGrains = fallingGrains.filter(g => {
    g.vy = Math.min(g.vy + 0.55, 11);
    g.y += g.vy;
    const stackH = (state.pile[g.col] || []).length;
    const landY = h - (stackH + 1) * SAND_CELL;
    if (g.y >= landY) {
      g.y = landY;
      state.pile[g.col].push(g.rarity);
      return false;
    }
    return true;
  });
  drawSand();
  if (fallingGrains.length > 0) {
    requestAnimationFrame(stepSandAnim);
  } else {
    sandAnimRunning = false;
  }
}

function startSandAnim() {
  if (sandAnimRunning) return;
  sandAnimRunning = true;
  requestAnimationFrame(stepSandAnim);
}

function renderSandPile() {
  syncPileWithStock();
  const unsortedCount = unsortedTotal();
  const el = $("unsorted-total");
  if (el) {
    el.textContent = `${unsortedCount} / ${UNSORTED_CAPACITY}`;
    el.style.color = unsortedCount >= UNSORTED_CAPACITY ? "#ff7a3d" : "";
  }
  ensurePileBuckets();
  drawSand();
}

function buildSetBar(rarity, foil) {
  const ownedList = foil ? state.ownedFoil[rarity] : state.owned[rarity];
  const owned = ownedList.length;
  const setSize = SET_SIZES[rarity];
  const pct = Math.min(100, (owned / setSize) * 100);
  const complete = owned >= setSize;
  const el = document.createElement("div");
  el.className = "set-bar" + (foil ? " foil" : "") + (complete ? " complete" : "");
  el.innerHTML = `
    <div class="set-bar-label" style="color:${RARITY_COLOURS[rarity]}">
      ${RARITY_LABELS[rarity]}
      <span class="set-bar-count">${owned}/${setSize}</span>
    </div>
    <div class="set-bar-track">
      <div class="set-bar-fill" style="width:${pct}%;background-color:${RARITY_COLOURS[rarity]}"></div>
    </div>`;
  return el;
}

function renderSetProgress() {
  const wrap = $("set-progress");
  wrap.innerHTML = "";
  const colRegular = document.createElement("div");
  const colFoil    = document.createElement("div");
  colRegular.style.cssText = "display:flex;flex-direction:column;gap:4px;";
  colFoil.style.cssText    = "display:flex;flex-direction:column;gap:4px;";
  const labelR = document.createElement("div");
  labelR.className = "set-col-label";
  labelR.textContent = "REGULAR SET";
  const labelF = document.createElement("div");
  labelF.className = "set-col-label";
  labelF.textContent = "✨ FOIL SET";
  colRegular.appendChild(labelR);
  colFoil.appendChild(labelF);
  RARITIES.forEach(rarity => {
    colRegular.appendChild(buildSetBar(rarity, false));
    colFoil.appendChild(buildSetBar(rarity, true));
  });
  wrap.appendChild(colRegular);
  wrap.appendChild(colFoil);
}

function renderAll() { renderHeader(); renderVault(); renderVaultGrid(); renderSetProgress(); renderSandPile(); }

// ---- Actions -------------------------------------------------------------
function buyPacks(qty, totalCost, label) {
  if (state.coins < totalCost) {
    $("hint").textContent = `Need ${usd(totalCost - state.coins)} more.`;
    return;
  }
  state.coins -= totalCost;
  state.packSupply += qty;
  renderAll(); save();
  $("hint").textContent = `Bought ${label}. Supply: ${state.packSupply}.`;
}

function unsortedTotal() {
  return SAND_BULK_RARITIES.reduce((s, r) => s + state.unsorted[r], 0);
}
function canRip() {
  return state.packSupply > 0 && unsortedTotal() < UNSORTED_CAPACITY;
}

function ripOne() {
  if (state.packSupply < 1) {
    $("hint").textContent = "No packs in supply. Buy one above.";
    return;
  }
  if (unsortedTotal() >= UNSORTED_CAPACITY) {
    $("hint").textContent = `Unsorted pile full (${UNSORTED_CAPACITY}). Sort some cards first.`;
    return;
  }
  state.packSupply -= 1;
  state.packsOpened += 1;
  const pulls = rollPack();
  let newCount = 0;
  const completions = []; // {rarity, foil}
  pulls.forEach(card => {
    const r = addPull(card);
    if (r.isNew) newCount += 1;
    if (r.completed) completions.push({ rarity: card.rarity, foil: card.foil });
  });
  spawnSandFromPulls(pulls);
  spawnParticles(pulls);
  showHits(pulls, { newCount, completions });
  renderAll(); save();
  const foilCount = pulls.filter(p => p.foil).length;
  const tail = foilCount > 0 ? `  ✨ ${foilCount} foil${foilCount > 1 ? "s" : ""}!` : "";
  $("hint").textContent = `Nice rip. ${state.packSupply} left.${tail}`;
}

function sellRarity(rarity, foil) {
  const bucket = foil ? state.stockFoil : state.stock;
  const qty    = bucket[rarity];
  if (qty === 0) return;
  const proceeds = Math.round(inventoryValue(rarity, foil) * 100) / 100;
  state.coins += proceeds;
  bucket[rarity] = 0;
  const mk = marketKey(rarity, foil);
  if (mk) {
    state.invById[mk] = {};
  }
  // grains track unsorted pile; selling sorted stock doesn't touch them
  renderAll(); save();
  const label = `${foil ? "foil " : ""}${RARITY_LABELS[rarity].toLowerCase()}${qty > 1 ? "s" : ""}`;
  $("hint").textContent = `Sold ${qty} ${label} for ${usd(proceeds)}.`;
}

function resetGame() {
  if (!confirm("Wipe everything and start over?")) return;
  state = defaultState();
  save();
  renderAll();
  $("hint").textContent = "Fresh start. A box on the house — start ripping!";
}

// ---- Boot ----------------------------------------------------------------
$("pack").addEventListener("click", ripOne);
$("buy-pack").addEventListener("click", () => buyPacks(1, packCost(), "1 pack"));
$("buy-box").addEventListener("click",  () => buyPacks(BOX_SIZE,  boxCost(),  "a box (36 packs)"));
$("buy-case").addEventListener("click", () => buyPacks(CASE_SIZE, caseCost(), "a case (216 packs)"));
$("stock-rows").addEventListener("click", (e) => {
  const btn = e.target.closest(".sell-btn");
  if (btn && btn.dataset.rarity) sellRarity(btn.dataset.rarity, btn.dataset.foil === "1");
});
$("vault-grid").addEventListener("click", (e) => {
  const cell = e.target.closest(".collection-cell.priced.owned");
  if (!cell) return;
  const rarity = cell.dataset.rarity;
  const id     = parseInt(cell.dataset.id, 10);
  const foil   = cell.dataset.foil === "1";
  sellCard(rarity, id, foil);
});
$("sand-canvas").addEventListener("click", () => sortCards());
$("sort-range-label").textContent = SORT_MIN === SORT_MAX ? `${SORT_MIN}` : `${SORT_MIN}-${SORT_MAX}`;
$("reset-btn").addEventListener("click", resetGame);
setInterval(save, 5000);
setInterval(tickMarket, MARKET_TICK_MS);
window.addEventListener("beforeunload", save);
window.addEventListener("resize", drawSand);
renderAll();
</script>

</body>
