<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pack Ripper</title>
<style>
  :root {
    --bg: #0e0a1a;
    --panel: #1a1530;
    --panel-light: #251f44;
    --ink: #ebe6ff;
    --muted: #8a82b8;
    --gold: #f5c542;
    --common: #b8b8c8;
    --uncommon: #5ad06a;
    --rare: #5aa8ff;
    --mythic: #ff7a3d;
    --foil: linear-gradient(135deg, #ff7eb3, #65d6ff, #b8ff5a, #ffd84d, #ff7eb3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: 'Segoe UI', Roboto, system-ui, sans-serif; height: 100%; }
  body { display: grid; grid-template-columns: 1fr 1.3fr; grid-template-rows: auto 1fr auto; height: 100vh; gap: 12px; padding: 12px; }
  header { grid-column: 1 / 3; display: flex; justify-content: space-between; align-items: center; padding: 8px 16px; background: var(--panel); border-radius: 10px; }
  header h1 { margin: 0; font-size: 1.2rem; letter-spacing: 1px; }
  header .stats { display: flex; gap: 24px; font-size: 0.95rem; align-items: center; }
  header .stats span b { color: var(--gold); }

  #shop, #vault { background: var(--panel); border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  #shop h2, #vault h2 { margin: 0; letter-spacing: 1px; font-size: 1rem; }

  .buy-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .buy-btn {
    background: var(--panel-light); border: 1px solid #3a3260; border-radius: 8px;
    padding: 10px 8px; color: var(--ink); cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; gap: 2px; transition: all 0.15s;
    text-align: center;
  }
  .buy-btn:hover:not(:disabled) { background: #2a2348; border-color: var(--gold); transform: translateY(-1px); }
  .buy-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .buy-btn .lbl { font-weight: bold; font-size: 0.95rem; letter-spacing: 1px; }
  .buy-btn .qty { color: var(--muted); font-size: 0.7rem; }
  .buy-btn .cost { color: var(--gold); font-size: 0.9rem; margin-top: 4px; font-weight: bold; }
  .buy-btn .save { color: var(--uncommon); font-size: 0.65rem; }

  #pack-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; }
  .pack {
    width: 200px; height: 290px; border-radius: 14px;
    background: linear-gradient(135deg, #3a2562, #5a2d8a 50%, #2d4a8a);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 30px rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    user-select: none; position: relative; overflow: hidden;
  }
  .pack::after { content: ""; position: absolute; inset: 8px; border: 2px dashed rgba(255,255,255,0.2); border-radius: 10px; pointer-events: none; }
  .pack:hover:not(.disabled) { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
  .pack.disabled { opacity: 0.45; cursor: not-allowed; }
  .pack .label { text-align: center; font-weight: 600; letter-spacing: 1px; }
  .pack .label small { display: block; color: var(--muted); font-weight: normal; margin-top: 6px; }

  #hint { text-align: center; font-size: 0.9rem; color: var(--gold); min-height: 1.2em; }

  .particle {
    position: fixed; pointer-events: none; z-index: 999;
    font-size: 1.3rem; line-height: 1;
    transform: translate(-50%, -50%);
    animation: particle-burst 0.75s ease-out forwards;
  }
  .particle.foil {
    text-shadow: 0 0 6px #fff, 0 0 14px #ffd84d;
    animation-duration: 1s;
  }
  @keyframes particle-burst {
    0%   { opacity: 1; transform: translate(-50%, -50%) scale(0.4); }
    50%  { opacity: 1; }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.3); }
  }

  .hit-popup {
    position: fixed; pointer-events: none; z-index: 1000;
    font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.9);
    transform: translate(-50%, -50%);
    animation: hit-float 1.5s ease-out forwards;
    white-space: nowrap;
  }
  .hit-popup.foil-hit {
    background: linear-gradient(90deg, #ff7eb3, #65d6ff, #b8ff5a, #ffd84d, #ff7eb3);
    background-size: 200% auto;
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    animation: hit-float 1.5s ease-out forwards, foil-text-scroll 1s linear infinite;
    filter: drop-shadow(0 0 8px rgba(255,255,255,0.6));
  }
  @keyframes hit-float {
    0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
    15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
    40%  { opacity: 1; transform: translate(-50%, calc(-50% - 30px)) scale(1); }
    100% { opacity: 0; transform: translate(-50%, calc(-50% - 90px)) scale(0.85); }
  }
  @keyframes foil-text-scroll {
    to { background-position: 200% center; }
  }

  #collection-cards {
    display: flex; flex-wrap: wrap; gap: 3px; align-content: flex-start;
    max-height: 70px; overflow-y: auto;
    background: rgba(0,0,0,0.18); border-radius: 6px; padding: 4px;
  }
  #collection-cards:empty::before {
    content: "No mythics or foils yet.";
    color: var(--muted); font-size: 0.75rem; font-style: italic;
  }
  .mini-card {
    width: 13px; height: 19px; border-radius: 2px; border: 1.5px solid;
    background: var(--panel-light); flex-shrink: 0;
  }
  .mini-card.foil-card {
    background: linear-gradient(135deg, #ff7eb3, #65d6ff, #b8ff5a, #ffd84d, #ff7eb3);
    background-size: 250% 250%;
    animation: shimmer 2.5s linear infinite;
    border-color: #fff;
  }
  .mini-card.foil-common   { border-color: #d8d8e6; }
  .mini-card.foil-uncommon { border-color: var(--uncommon); box-shadow: 0 0 4px rgba(90,208,106,0.7); }
  .mini-card.foil-rare     { border-color: var(--rare);     box-shadow: 0 0 5px rgba(90,168,255,0.8); }
  .mini-card.foil-mythic   {
    border-color: var(--mythic);
    box-shadow: 0 0 9px rgba(255,122,61,0.9);
    width: 16px; height: 22px;
  }
  @keyframes shimmer { 0% { background-position: 0% 50%; } 100% { background-position: 250% 50%; } }

  #set-progress {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px 12px;
    padding: 8px 10px;
    background: rgba(0,0,0,0.18);
    border-radius: 6px;
  }
  .set-col-label {
    font-size: 0.6rem; letter-spacing: 2px; color: var(--muted);
    text-align: center; margin-bottom: 2px;
  }
  .set-bar { display: flex; flex-direction: column; gap: 2px; }
  .set-bar-label {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 0.65rem; font-weight: bold; letter-spacing: 1px;
  }
  .set-bar-count { color: var(--muted); font-weight: normal; }
  .set-bar-track {
    height: 5px; background: rgba(255,255,255,0.06);
    border-radius: 3px; overflow: hidden;
  }
  .set-bar-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.35s ease;
  }
  .set-bar.foil .set-bar-fill {
    background-image: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.55) 50%, rgba(255,255,255,0) 100%);
    background-repeat: no-repeat;
    background-size: 60% 100%;
    background-position: -60% 0;
    animation: bar-foil-sweep 2.4s linear infinite;
  }
  .set-bar.complete .set-bar-fill {
    background: linear-gradient(90deg, #ff7eb3, #65d6ff, #b8ff5a, #ffd84d, #ff7eb3) !important;
    background-size: 200% auto;
    animation: shimmer-bar 2s linear infinite;
  }
  .set-bar.complete .set-bar-count { color: var(--gold); }
  @keyframes shimmer-bar { to { background-position: 200% center; } }
  @keyframes bar-foil-sweep { to { background-position: 160% 0; } }
  #sand-canvas {
    display: block; width: 100%; height: 90px;
    background: rgba(0,0,0,0.18); border-radius: 6px;
    pointer-events: none;
  }

  #stock-rows { display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 4px; }
  .stock-row {
    background: var(--panel-light); border-radius: 8px; padding: 12px 14px;
    display: grid; grid-template-columns: 0.9fr 1.3fr auto; align-items: center; gap: 12px;
    border-left: 4px solid #444;
  }
  .stock-row.common    { border-left-color: var(--common); }
  .stock-row.uncommon  { border-left-color: var(--uncommon); }
  .stock-row.rare      { border-left-color: var(--rare); }
  .stock-row.mythic    { border-left-color: var(--mythic); box-shadow: 0 0 12px rgba(255,122,61,0.2); }
  .rarity-name { font-weight: bold; letter-spacing: 1px; font-size: 0.95rem; }
  .counts { display: flex; flex-direction: column; gap: 3px; font-size: 0.78rem; color: var(--muted); }
  .counts b { color: var(--ink); font-size: 0.9rem; }
  .counts .foil-line b { color: #fff; }
  .counts .foil-line { background: rgba(255,255,255,0.04); padding: 2px 6px; border-radius: 4px; }
  .counts .sell-price { font-size: 0.65rem; color: var(--gold); }
  .sell-stack { display: flex; flex-direction: column; gap: 6px; }
  .sell-btn {
    background: transparent; color: var(--gold); border: 1px solid var(--gold);
    border-radius: 6px; padding: 7px 12px; cursor: pointer; font-family: inherit;
    font-weight: bold; font-size: 0.75rem; min-width: 160px; letter-spacing: 1px;
    transition: all 0.15s; white-space: nowrap;
  }
  .sell-btn:hover:not(:disabled) { background: var(--gold); color: #111; }
  .sell-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .sell-btn.foil {
    background: var(--foil); background-size: 250% 250%;
    animation: shimmer 3s linear infinite;
    color: #111; border-color: #fff;
  }
  .sell-btn.foil:hover:not(:disabled) { filter: brightness(1.1); }

  .sell-all-btn {
    background: var(--gold); color: #111; border: none;
    border-radius: 8px; padding: 14px; cursor: pointer; font-family: inherit;
    font-weight: bold; letter-spacing: 1px; font-size: 0.95rem;
    transition: all 0.15s;
  }
  .sell-all-btn:hover:not(:disabled) { background: #fcd968; transform: translateY(-1px); }
  .sell-all-btn:disabled { opacity: 0.35; cursor: not-allowed; background: var(--panel-light); color: var(--muted); }

  footer { grid-column: 1 / 3; text-align: center; color: var(--muted); font-size: 0.75rem; padding: 4px; }
  button.reset { background: transparent; color: var(--muted); border: 1px solid var(--muted); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 0.75rem; }
  button.reset:hover { color: var(--ink); border-color: var(--ink); }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto auto auto; height: auto; }
    header { grid-column: 1; }
    footer { grid-column: 1; }
  }
</style>
</head>
<body>

<header>
  <h1>PACK RIPPER</h1>
  <div class="stats">
    <span>Cash: <b id="coins">$0</b></span>
    <span>Packs opened: <b id="packs-opened">0</b></span>
    <span>Foils pulled: <b id="foils-pulled">0</b></span>
    <button class="reset" id="reset-btn">Reset</button>
  </div>
</header>

<section id="shop">
  <h2>SHOP</h2>
  <div class="buy-buttons">
    <button class="buy-btn" id="buy-pack">
      <div class="lbl">PACK</div>
      <div class="qty">1 pack</div>
      <div class="cost" id="cost-pack">$4</div>
    </button>
    <button class="buy-btn" id="buy-box">
      <div class="lbl">BOX</div>
      <div class="qty">36 packs</div>
      <div class="cost" id="cost-box">$125</div>
      <div class="save">save 11%</div>
    </button>
    <button class="buy-btn" id="buy-case">
      <div class="lbl">CASE</div>
      <div class="qty">6 boxes · 216 packs</div>
      <div class="cost" id="cost-case">$700</div>
      <div class="save">save 17%</div>
    </button>
  </div>
  <div id="collection-cards"></div>
  <div id="set-progress"></div>
  <div id="pack-area">
    <div class="pack" id="pack">
      <div class="label">SERIES I<br>BOOSTER<small id="supply-label">Supply: 0</small></div>
    </div>
<div id="hint">A box on the house — start ripping!</div>
  </div>
  <canvas id="sand-canvas"></canvas>
</section>

<section id="vault">
  <h2>VAULT</h2>
  <div id="stock-rows"></div>
  <button id="sell-all" class="sell-all-btn" disabled>SELL COMPLETE COLLECTION</button>
</section>

<footer>15 cards/pack — 10C · 3U · 1R/M · 1 special (85% common, 15% foil). Foil 3× sell value.</footer>

<script>
// ---- Config --------------------------------------------------------------
const RARITIES = ["common", "uncommon", "rare", "mythic"];
const RARITY_LABELS  = { common: "COMMON",   uncommon: "UNCOMMON", rare: "RARE",  mythic: "MYTHIC" };
const RARITY_COLOURS = { common: "#b8b8c8",  uncommon: "#5ad06a",  rare: "#5aa8ff", mythic: "#ff7a3d" };
const RARITY_GLYPHS  = { common: "●",        uncommon: "◆",        rare: "★",      mythic: "✦" };
const SELL_PRICE     = { common: 1,          uncommon: 5,          rare: 50,       mythic: 500 };

const FOIL_MULTIPLIER = 3;
// Special slot: 15% chance the slot becomes a foil; foil rarity weighted toward common
const FOIL_SLOT_CHANCE = 0.15;
const FOIL_RARITY_WEIGHTS = { common: 0.60, uncommon: 0.25, rare: 0.12, mythic: 0.03 };

const SET_SIZE = 100; // unique cards per rarity

const PACK_COST = 4;
const BOX_COST  = 125;
const CASE_COST = 700;
const BOX_SIZE  = 36;
const CASE_SIZE = 216;

function foilPrice(rarity) { return SELL_PRICE[rarity] * FOIL_MULTIPLIER; }

// ---- State ---------------------------------------------------------------
const SAVE_KEY = "cryptid_almanac_save_v4"; // bumped: starter box
const defaultState = () => ({
  coins: 0,
  packsOpened: 0,
  packSupply: BOX_SIZE, // start with a box on the house
  stock:      { common: 0, uncommon: 0, rare: 0, mythic: 0 },
  stockFoil:  { common: 0, uncommon: 0, rare: 0, mythic: 0 },
  opened:     { common: 0, uncommon: 0, rare: 0, mythic: 0 },
  openedFoil: { common: 0, uncommon: 0, rare: 0, mythic: 0 },
  pile: [], // [colIndex] = array of rarity strings, bottom-up
  owned:     { common: [], uncommon: [], rare: [], mythic: [] },
  ownedFoil: { common: [], uncommon: [], rare: [], mythic: [] },
  setsCelebrated:     { common: false, uncommon: false, rare: false, mythic: false },
  setsCelebratedFoil: { common: false, uncommon: false, rare: false, mythic: false },
});

function pickRandomIds(n) {
  const all = [];
  for (let i = 1; i <= SET_SIZE; i++) all.push(i);
  for (let i = all.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [all[i], all[j]] = [all[j], all[i]];
  }
  return all.slice(0, Math.min(n, SET_SIZE)).sort((a, b) => a - b);
}
let state = load() || defaultState();

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (typeof parsed.coins !== "number" || !parsed.stock || !parsed.stockFoil) return null;
    if (!Array.isArray(parsed.pile)) parsed.pile = [];
    if (!parsed.owned) {
      // Backfill set ownership for legacy saves: grant random IDs based on lifetime opened.
      parsed.owned     = { common: [], uncommon: [], rare: [], mythic: [] };
      parsed.ownedFoil = { common: [], uncommon: [], rare: [], mythic: [] };
      RARITIES.forEach(r => {
        parsed.owned[r]     = pickRandomIds(parsed.opened[r]     || 0);
        parsed.ownedFoil[r] = pickRandomIds(parsed.openedFoil[r] || 0);
      });
    }
    if (!parsed.setsCelebrated) {
      parsed.setsCelebrated     = { common: false, uncommon: false, rare: false, mythic: false };
      parsed.setsCelebratedFoil = { common: false, uncommon: false, rare: false, mythic: false };
      RARITIES.forEach(r => {
        if (parsed.owned[r].length     >= SET_SIZE) parsed.setsCelebrated[r]     = true;
        if (parsed.ownedFoil[r].length >= SET_SIZE) parsed.setsCelebratedFoil[r] = true;
      });
    }
    return parsed;
  } catch { return null; }
}
function save() { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
function fmt(n) { return Math.floor(n).toLocaleString(); }
function usd(n) { return "$" + fmt(n); }

// ---- Pulls ---------------------------------------------------------------
function rollRareMythicSlot() {
  return Math.random() < 0.10 ? "mythic" : "rare";
}
function rollFoilRarity() {
  const r = Math.random();
  if (r < FOIL_RARITY_WEIGHTS.mythic)   return "mythic";
  if (r < FOIL_RARITY_WEIGHTS.mythic + FOIL_RARITY_WEIGHTS.rare)   return "rare";
  if (r < FOIL_RARITY_WEIGHTS.mythic + FOIL_RARITY_WEIGHTS.rare + FOIL_RARITY_WEIGHTS.uncommon) return "uncommon";
  return "common";
}
function rollSpecialSlot() {
  // Only source of foils: 15% foil (rarity-weighted), otherwise a common
  if (Math.random() < FOIL_SLOT_CHANCE) return { rarity: rollFoilRarity(), foil: true };
  return { rarity: "common", foil: false };
}
function randomCardId() { return Math.floor(Math.random() * SET_SIZE) + 1; }
function rollPack() {
  // 10 commons, 3 uncommons, 1 rare/mythic, 1 special (common or foil)
  const cards = [];
  for (let i = 0; i < 10; i++) cards.push({ rarity: "common",   foil: false });
  for (let i = 0; i <  3; i++) cards.push({ rarity: "uncommon", foil: false });
  cards.push({ rarity: rollRareMythicSlot(), foil: false });
  cards.push(rollSpecialSlot());
  return cards.map(c => ({ ...c, id: randomCardId() }));
}
function addPull(card) {
  if (card.foil) {
    state.stockFoil[card.rarity]  += 1;
    state.openedFoil[card.rarity] += 1;
  } else {
    state.stock[card.rarity]  += 1;
    state.opened[card.rarity] += 1;
  }
  const ownedList = card.foil ? state.ownedFoil[card.rarity] : state.owned[card.rarity];
  if (!ownedList.includes(card.id)) {
    ownedList.push(card.id);
    const completed = ownedList.length >= SET_SIZE;
    const celebratedFlag = card.foil ? state.setsCelebratedFoil : state.setsCelebrated;
    const firstCompletion = completed && !celebratedFlag[card.rarity];
    if (firstCompletion) celebratedFlag[card.rarity] = true;
    return { isNew: true, completed: firstCompletion };
  }
  return { isNew: false, completed: false };
}
function totalFoilsOpened() {
  return RARITIES.reduce((s, r) => s + state.openedFoil[r], 0);
}

// ---- Economy -------------------------------------------------------------
function packCost() { return PACK_COST; }
function boxCost()  { return BOX_COST; }
function caseCost() { return CASE_COST; }

// ---- Render --------------------------------------------------------------
const $ = id => document.getElementById(id);

function renderHeader() {
  $("coins").textContent        = usd(state.coins);
  $("packs-opened").textContent = state.packsOpened;
  $("foils-pulled").textContent = totalFoilsOpened();
  $("supply-label").textContent = `Supply: ${state.packSupply}`;
  $("cost-pack").textContent = usd(packCost());
  $("cost-box").textContent  = usd(boxCost());
  $("cost-case").textContent = usd(caseCost());
  $("buy-pack").disabled = state.coins < packCost();
  $("buy-box").disabled  = state.coins < boxCost();
  $("buy-case").disabled = state.coins < caseCost();
  const pack = $("pack");
  if (state.packSupply < 1) pack.classList.add("disabled");
  else pack.classList.remove("disabled");
}

function renderVault() {
  const grid = $("stock-rows");
  grid.innerHTML = "";
  RARITIES.forEach(rarity => {
    const stock     = state.stock[rarity];
    const stockF    = state.stockFoil[rarity];
    const opened    = state.opened[rarity];
    const openedF   = state.openedFoil[rarity];
    const normalProceeds = stock  * SELL_PRICE[rarity];
    const foilProceeds   = stockF * foilPrice(rarity);
    const row = document.createElement("div");
    row.className = `stock-row ${rarity}`;
    row.innerHTML = `
      <div class="rarity-name" style="color:${RARITY_COLOURS[rarity]}">${RARITY_GLYPHS[rarity]} ${RARITY_LABELS[rarity]}</div>
      <div class="counts">
        <span>Stock: <b>${stock}</b> · lifetime <b>${opened}</b> <span class="sell-price">@ ${usd(SELL_PRICE[rarity])}</span></span>
        ${(stockF + openedF) > 0
          ? `<span class="foil-line">✨ Foils: <b>${stockF}</b> · lifetime <b>${openedF}</b> <span class="sell-price">@ ${usd(foilPrice(rarity))}</span></span>`
          : ""}
      </div>
      <div class="sell-stack">
        <button class="sell-btn" data-rarity="${rarity}" data-foil="0" ${stock === 0 ? "disabled" : ""}>
          ${stock === 0 ? "—" : `SELL ${stock} → ${usd(normalProceeds)}`}
        </button>
        ${stockF > 0
          ? `<button class="sell-btn foil" data-rarity="${rarity}" data-foil="1">SELL ✨${stockF} → ${usd(foilProceeds)}</button>`
          : ""}
      </div>`;
    grid.appendChild(row);
  });
  let totalCount = 0, totalValue = 0;
  RARITIES.forEach(r => {
    totalCount += state.stock[r] + state.stockFoil[r];
    totalValue += state.stock[r] * SELL_PRICE[r] + state.stockFoil[r] * foilPrice(r);
  });
  $("sell-all").disabled = totalCount === 0;
  $("sell-all").textContent = totalCount === 0
    ? "SELL COMPLETE COLLECTION"
    : `SELL COMPLETE COLLECTION  ·  ${totalCount} cards → ${usd(totalValue)}`;
}

function spawnParticles(pulls) {
  const rect = $("pack").getBoundingClientRect();
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height / 2;
  pulls.forEach((card, i) => {
    const el = document.createElement("span");
    el.className = "particle" + (card.foil ? " foil" : "");
    el.textContent = RARITY_GLYPHS[card.rarity];
    el.style.color = card.foil ? "#fff" : RARITY_COLOURS[card.rarity];
    const angle = Math.random() * Math.PI * 2;
    const dist  = 80 + Math.random() * 140;
    el.style.setProperty("--dx", (Math.cos(angle) * dist) + "px");
    el.style.setProperty("--dy", (Math.sin(angle) * dist) + "px");
    el.style.left = cx + "px";
    el.style.top  = cy + "px";
    el.style.animationDelay = (i * 18) + "ms";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  });
}

function showHits(pulls, meta = {}) {
  const rect = $("pack").getBoundingClientRect();
  const cx = rect.left + rect.width  / 2;
  const cy = rect.top  + rect.height / 2;

  const hits = [];
  const mythic = pulls.find(c => !c.foil && c.rarity === "mythic");
  if (mythic) {
    hits.push({ text: "MYTHIC!", color: RARITY_COLOURS.mythic, size: "2rem" });
  }
  const foilCard = pulls.find(c => c.foil);
  if (foilCard) {
    const isMythic = foilCard.rarity === "mythic";
    hits.push({ text: `FOIL ${RARITY_LABELS[foilCard.rarity]}!`, size: isMythic ? "2rem" : "1.5rem", foil: true });
  }
  if (meta.newCount > 0) {
    hits.push({ text: `+${meta.newCount} NEW`, color: "#7fffaa", size: "1.3rem" });
  }
  (meta.completions || []).forEach(c => {
    hits.push({
      text: `${c.foil ? "FOIL " : ""}${RARITY_LABELS[c.rarity]} SET COMPLETE!`,
      size: "1.7rem",
      foil: true,
    });
  });

  hits.forEach((hit, i) => {
    const el = document.createElement("div");
    el.className = "hit-popup" + (hit.foil ? " foil-hit" : "");
    el.textContent = hit.text;
    if (!hit.foil) el.style.color = hit.color;
    el.style.fontSize = hit.size;
    el.style.left = (cx + (i - (hits.length - 1) / 2) * 140) + "px";
    el.style.top  = (cy - 60) + "px";
    el.style.animationDelay = (i * 180) + "ms";
    document.body.appendChild(el);
    el.addEventListener("animationend", () => el.remove(), { once: true });
  });
}

function renderCollectionCards() {
  const container = $("collection-cards");
  container.innerHTML = "";
  const items = [
    ...Array(state.stock.mythic).fill({ rarity: "mythic", foil: false }),
    ...Array(state.stockFoil.common).fill({ rarity: "common",   foil: true }),
    ...Array(state.stockFoil.uncommon).fill({ rarity: "uncommon", foil: true }),
    ...Array(state.stockFoil.rare).fill({ rarity: "rare",     foil: true }),
    ...Array(state.stockFoil.mythic).fill({ rarity: "mythic",  foil: true }),
  ];
  const MAX = 250;
  items.slice(0, MAX).forEach(item => {
    const el = document.createElement("div");
    el.className = item.foil ? `mini-card foil-card foil-${item.rarity}` : "mini-card";
    if (!item.foil) el.style.borderColor = RARITY_COLOURS[item.rarity];
    container.appendChild(el);
  });
  if (items.length > MAX) {
    const more = document.createElement("span");
    more.style.cssText = "font-size:0.7rem;color:var(--muted);align-self:center;";
    more.textContent = `+${items.length - MAX} more`;
    container.appendChild(more);
  }
}

// ---- Sand simulation -----------------------------------------------------
const SAND_GRAIN = 5;
const SAND_CELL  = 7;
const SAND_COLOR = { common: "#b8b8c8", uncommon: "#5ad06a", rare: "#5aa8ff" };
const SAND_BULK_RARITIES = ["common", "uncommon", "rare"];
let fallingGrains = []; // {col, y, vy, rarity}
let sandAnimRunning = false;

function sandColCount() {
  const c = $("sand-canvas");
  return Math.max(1, Math.floor((c.clientWidth || 300) / SAND_CELL));
}

function ensurePileBuckets() {
  const cols = sandColCount();
  while (state.pile.length < cols) state.pile.push([]);
}

function totalPileGrains() {
  return state.pile.reduce((s, col) => s + col.length, 0);
}

function rebuildPileFromStock() {
  state.pile = [];
  ensurePileBuckets();
  const cols = sandColCount();
  SAND_BULK_RARITIES.forEach(r => {
    for (let i = 0; i < state.stock[r]; i++) {
      const c = Math.floor(Math.random() * cols);
      state.pile[c].push(r);
    }
  });
}

function syncPileWithStock() {
  // If the pile and bulk stock have drifted (eg. migration), rebuild.
  const stockBulk = SAND_BULK_RARITIES.reduce((s, r) => s + state.stock[r], 0);
  if (totalPileGrains() + fallingGrains.length !== stockBulk) {
    rebuildPileFromStock();
  }
}

function removeGrainsByRarity(rarity) {
  if (!SAND_BULK_RARITIES.includes(rarity)) return;
  state.pile = state.pile.map(col => col.filter(r => r !== rarity));
}

function removeAllBulkGrains() {
  state.pile = state.pile.map(() => []);
}

function spawnSandFromPulls(pulls) {
  const bulk = pulls.filter(c => !c.foil && SAND_BULK_RARITIES.includes(c.rarity));
  ensurePileBuckets();
  const cols = sandColCount();
  // Spawn all grains synchronously into fallingGrains, but stagger their
  // starting Y so they enter the canvas one-by-one — creates a sandfall stream.
  bulk.forEach((card, i) => {
    fallingGrains.push({
      col: Math.floor(Math.random() * cols),
      y: -SAND_CELL - i * (SAND_CELL * 1.6) - Math.random() * 5,
      vy: 0,
      rarity: card.rarity,
    });
  });
  startSandAnim();
}

function drawSand() {
  const canvas = $("sand-canvas");
  const w = canvas.clientWidth  || 300;
  const h = canvas.clientHeight || 90;
  if (canvas.width  !== w) canvas.width  = w;
  if (canvas.height !== h) canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, w, h);
  const cols = sandColCount();
  for (let c = 0; c < state.pile.length && c < cols; c++) {
    const stack = state.pile[c];
    for (let r = 0; r < stack.length; r++) {
      const x = c * SAND_CELL + 1;
      const y = h - (r + 1) * SAND_CELL + 1;
      ctx.fillStyle = SAND_COLOR[stack[r]] || "#b8b8c8";
      ctx.beginPath();
      ctx.arc(x + SAND_GRAIN / 2, y + SAND_GRAIN / 2, SAND_GRAIN / 2, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  fallingGrains.forEach(g => {
    const x = g.col * SAND_CELL + 1;
    ctx.fillStyle = SAND_COLOR[g.rarity] || "#b8b8c8";
    ctx.beginPath();
    ctx.arc(x + SAND_GRAIN / 2, g.y + SAND_GRAIN / 2, SAND_GRAIN / 2, 0, Math.PI * 2);
    ctx.fill();
  });
}

function stepSandAnim() {
  const canvas = $("sand-canvas");
  const h = canvas.clientHeight || 90;
  ensurePileBuckets();
  fallingGrains = fallingGrains.filter(g => {
    g.vy = Math.min(g.vy + 0.55, 11);
    g.y += g.vy;
    const stackH = (state.pile[g.col] || []).length;
    const landY = h - (stackH + 1) * SAND_CELL;
    if (g.y >= landY) {
      g.y = landY;
      state.pile[g.col].push(g.rarity);
      return false;
    }
    return true;
  });
  drawSand();
  if (fallingGrains.length > 0) {
    requestAnimationFrame(stepSandAnim);
  } else {
    sandAnimRunning = false;
  }
}

function startSandAnim() {
  if (sandAnimRunning) return;
  sandAnimRunning = true;
  requestAnimationFrame(stepSandAnim);
}

function renderSandPile() {
  syncPileWithStock();
  ensurePileBuckets();
  drawSand();
}

function buildSetBar(rarity, foil) {
  const ownedList = foil ? state.ownedFoil[rarity] : state.owned[rarity];
  const owned = ownedList.length;
  const pct = Math.min(100, (owned / SET_SIZE) * 100);
  const complete = owned >= SET_SIZE;
  const el = document.createElement("div");
  el.className = "set-bar" + (foil ? " foil" : "") + (complete ? " complete" : "");
  el.innerHTML = `
    <div class="set-bar-label" style="color:${RARITY_COLOURS[rarity]}">
      ${RARITY_LABELS[rarity]}
      <span class="set-bar-count">${owned}/${SET_SIZE}</span>
    </div>
    <div class="set-bar-track">
      <div class="set-bar-fill" style="width:${pct}%;background-color:${RARITY_COLOURS[rarity]}"></div>
    </div>`;
  return el;
}

function renderSetProgress() {
  const wrap = $("set-progress");
  wrap.innerHTML = "";
  const colRegular = document.createElement("div");
  const colFoil    = document.createElement("div");
  colRegular.style.cssText = "display:flex;flex-direction:column;gap:4px;";
  colFoil.style.cssText    = "display:flex;flex-direction:column;gap:4px;";
  const labelR = document.createElement("div");
  labelR.className = "set-col-label";
  labelR.textContent = "REGULAR SET";
  const labelF = document.createElement("div");
  labelF.className = "set-col-label";
  labelF.textContent = "✨ FOIL SET";
  colRegular.appendChild(labelR);
  colFoil.appendChild(labelF);
  RARITIES.forEach(rarity => {
    colRegular.appendChild(buildSetBar(rarity, false));
    colFoil.appendChild(buildSetBar(rarity, true));
  });
  wrap.appendChild(colRegular);
  wrap.appendChild(colFoil);
}

function renderAll() { renderHeader(); renderVault(); renderCollectionCards(); renderSetProgress(); renderSandPile(); }

// ---- Actions -------------------------------------------------------------
function buyPacks(qty, totalCost, label) {
  if (state.coins < totalCost) {
    $("hint").textContent = `Need ${usd(totalCost - state.coins)} more.`;
    return;
  }
  state.coins -= totalCost;
  state.packSupply += qty;
  renderAll(); save();
  $("hint").textContent = `Bought ${label}. Supply: ${state.packSupply}.`;
}

function ripOne() {
  if (state.packSupply < 1) {
    $("hint").textContent = "No packs in supply. Buy one above.";
    return;
  }
  state.packSupply -= 1;
  state.packsOpened += 1;
  const pulls = rollPack();
  let newCount = 0;
  const completions = []; // {rarity, foil}
  pulls.forEach(card => {
    const r = addPull(card);
    if (r.isNew) newCount += 1;
    if (r.completed) completions.push({ rarity: card.rarity, foil: card.foil });
  });
  spawnSandFromPulls(pulls);
  spawnParticles(pulls);
  showHits(pulls, { newCount, completions });
  renderAll(); save();
  const foilCount = pulls.filter(p => p.foil).length;
  const tail = foilCount > 0 ? `  ✨ ${foilCount} foil${foilCount > 1 ? "s" : ""}!` : "";
  $("hint").textContent = `Nice rip. ${state.packSupply} left.${tail}`;
}

function sellRarity(rarity, foil) {
  const bucket = foil ? state.stockFoil : state.stock;
  const price  = foil ? foilPrice(rarity) : SELL_PRICE[rarity];
  const qty    = bucket[rarity];
  if (qty === 0) return;
  const proceeds = qty * price;
  state.coins += proceeds;
  bucket[rarity] = 0;
  if (!foil) removeGrainsByRarity(rarity);
  renderAll(); save();
  const label = `${foil ? "foil " : ""}${RARITY_LABELS[rarity].toLowerCase()}${qty > 1 ? "s" : ""}`;
  $("hint").textContent = `Sold ${qty} ${label} for ${usd(proceeds)}.`;
}

function sellAll() {
  let total = 0, count = 0;
  RARITIES.forEach(r => {
    total += state.stock[r]     * SELL_PRICE[r];
    total += state.stockFoil[r] * foilPrice(r);
    count += state.stock[r] + state.stockFoil[r];
    state.stock[r] = 0;
    state.stockFoil[r] = 0;
  });
  if (count === 0) return;
  state.coins += total;
  removeAllBulkGrains();
  renderAll(); save();
  $("hint").textContent = `Sold complete collection — ${count} cards (foils included) for ${usd(total)}.`;
}

function resetGame() {
  if (!confirm("Wipe everything and start over?")) return;
  state = defaultState();
  save();
  renderAll();
  $("hint").textContent = "Fresh start. A box on the house — start ripping!";
}

// ---- Boot ----------------------------------------------------------------
$("pack").addEventListener("click", ripOne);
$("buy-pack").addEventListener("click", () => buyPacks(1, packCost(), "1 pack"));
$("buy-box").addEventListener("click",  () => buyPacks(BOX_SIZE,  boxCost(),  "a box (36 packs)"));
$("buy-case").addEventListener("click", () => buyPacks(CASE_SIZE, caseCost(), "a case (216 packs)"));
$("sell-all").addEventListener("click", sellAll);
$("stock-rows").addEventListener("click", (e) => {
  const btn = e.target.closest(".sell-btn");
  if (btn && btn.dataset.rarity) sellRarity(btn.dataset.rarity, btn.dataset.foil === "1");
});
$("reset-btn").addEventListener("click", resetGame);
setInterval(save, 5000);
window.addEventListener("beforeunload", save);
window.addEventListener("resize", drawSand);
renderAll();
</script>
